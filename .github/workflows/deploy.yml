name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            # Repository variable (Settings > Secrets and variables > Actions > Variables): the contact API's URL.
            PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}

        steps:
            # Without it, the site would be built against the local API (the default in astro.config.mjs).
            - name: Check PUBLIC_API_URL is set
              run: test -n "$PUBLIC_API_URL" || { echo "::error::Set the PUBLIC_API_URL repository variable"; exit 1; }

            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
                  cache: true

            - run: bun install
            - run: bun run build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: web/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
